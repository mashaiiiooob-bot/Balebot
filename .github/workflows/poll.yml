name: Balebot poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_bale:
        description: "فقط یک پیام آزمایشی به بله بفرست"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# فقط یک اجرا در هر لحظه؛ اجرای بعدی صف می‌شود تا بلافاصله پس از پایان قبلی شروع شود (کمترین فاصله)
concurrency:
  group: balebot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # اگر گیت‌هاب زمان‌بندی را به‌خاطر بی‌فعالی غیرفعال کرده باشد، دوباره فعالش می‌کند
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable poll.yml -R "${{ github.repository }}" || true

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll Telegram and forward to Bale
        id: poll
        run: |
          ( while sleep 60; do bash save_state.sh || true; done ) &
          SAVER=$!
          python poll.py ${{ github.event.inputs.test_bale == 'true' && '--test-bale' || '' }}
          CODE=$?
          kill $SAVER 2>/dev/null || true
          exit $CODE
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_ADMIN_CHAT: ${{ secrets.BALE_ADMIN_CHAT }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          SOURCES: ${{ secrets.SOURCES }}
          SOURCES_EXTRA: ${{ secrets.SOURCES_EXTRA }}
          SOURCES_REMOVE: ${{ secrets.SOURCES_REMOVE }}
          SOURCES_ADD: ${{ secrets.SOURCES_ADD }}
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
          DROP_WORDS: ${{ secrets.DROP_WORDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODE: ${{ secrets.AI_MODE }}
          DROP_WORDS_EXTRA: ${{ secrets.DROP_WORDS_EXTRA }}
          BLOCKLIST_EXTRA: ${{ secrets.BLOCKLIST_EXTRA }}
          BALE_DESTINATION: ${{ vars.BALE_DESTINATION }}
          SIGNATURE: ${{ vars.SIGNATURE }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS }}
          POLL_INTERVAL: ${{ vars.POLL_INTERVAL }}
          BACKFILL_LIMIT: ${{ vars.BACKFILL_LIMIT }}
          PROFANITY_MIN_LEVEL: ${{ vars.PROFANITY_MIN_LEVEL }}

      - name: Save state
        if: always()
        run: bash save_state.sh

      # اجرای بعدی را بلافاصله شروع می‌کند تا به cron گیت‌هاب وابسته نباشیم.
      # فقط وقتی اجرا موفق بوده؛ در خطا cron دوباره راه می‌اندازد (جلوگیری از حلقه‌ی خطا).
      - name: Chain next run
        if: steps.poll.outcome == 'success' && github.event.inputs.test_bale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
