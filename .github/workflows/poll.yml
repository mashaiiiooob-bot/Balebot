name: Balebot poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# فقط یک اجرا در هر لحظه؛ اجرای بعدی صف می‌شود تا بلافاصله پس از پایان قبلی شروع شود (کمترین فاصله)
concurrency:
  group: balebot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll Telegram and forward to Bale
        run: python poll.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          SOURCES: ${{ secrets.SOURCES }}
          BALE_DESTINATION: ${{ vars.BALE_DESTINATION }}
          SIGNATURE: ${{ vars.SIGNATURE }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS }}
          POLL_INTERVAL: ${{ vars.POLL_INTERVAL }}
          BACKFILL_LIMIT: ${{ vars.BACKFILL_LIMIT }}

      - name: Save state
        if: always()
        working-directory: state
        run: |
          git config user.name "balebot-state"
          git config user.email "balebot-state@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit --amend -q -m "state"
            git push -q --force origin HEAD:state
          fi
